name: Apple build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: headwire-apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: headwire-apple
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag and source
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git cat-file tag "$GITHUB_REF_NAME" | grep -q '^-----BEGIN \(SSH\|PGP\) SIGNATURE-----$'
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Common.xcconfig)" = "${GITHUB_REF_NAME#v}"
      - name: Read engine pin
        id: engine
        run: echo "ref=$(cat Config/Headwire.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/headwire
          ref: ${{ steps.engine.outputs.ref }}
          path: headwire
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: headwire/go.mod
          cache-dependency-path: headwire/go.sum
      - name: Go development checks
        working-directory: headwire
        run: scripts/check.sh
      - name: Create the profile directory the bridge tests load from
        run: sudo install -d -o root -g wheel -m 755 /etc/headwire
      - name: Apple development checks, macOS tests and bridge ABI checks
        run: scripts/check.sh
      - name: iOS device build (unsigned)
        run: |
          xcodebuild -project Headwire.xcodeproj -scheme HeadwireiOS \
            -configuration Debug -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

  sign:
    environment: apple-signing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: headwire-apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: headwire-apple
          persist-credentials: false
      - name: Read engine pin
        id: engine
        run: echo "ref=$(cat Config/Headwire.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/headwire
          ref: ${{ steps.engine.outputs.ref }}
          path: headwire
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: headwire/go.mod
          cache: false
      - name: Materialize signing inputs
        env:
          DEVELOPER_ID_PEM: ${{ secrets.APPLE_DEVELOPER_ID_PEM }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APP_PROFILE: ${{ secrets.APPLE_MACOS_APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE: ${{ secrets.APPLE_MACOS_EXTENSION_PROFILE_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/headwire-signing"
          printf '%s' "$DEVELOPER_ID_PEM" > "$RUNNER_TEMP/headwire-signing/signing.pem"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/headwire-signing/notary.p8"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/headwire-signing/app.provisionprofile"
          printf '%s' "$EXTENSION_PROFILE" | base64 --decode > "$RUNNER_TEMP/headwire-signing/extension.provisionprofile"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'headwire-signing'
          (directory / 'notary.json').write_text(json.dumps({
              'key': str(directory / 'notary.p8'),
              'key-id': os.environ['NOTARY_KEY_ID'],
              'issuer': os.environ['NOTARY_ISSUER'],
          }))
          PY
          printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > Config/Developer.xcconfig
      - name: Build and notarize release
        run: ./scripts/release.sh "$RUNNER_TEMP/headwire-signing" "$GITHUB_REF_NAME"
      - name: Remove signing inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/headwire-signing" Config/Developer.xcconfig
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release
          path: headwire-apple/build/releases/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 14

  release:
    environment: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-release
          path: release
      - name: Check checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" ./*.zip build-info.txt SHA256SUMS \
            --verify-tag --draft --title "$GITHUB_REF_NAME" \
            --notes 'Replace these notes before publishing, describing what changed in this release.'
